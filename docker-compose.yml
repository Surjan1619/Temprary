services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digitaldoor}
      POSTGRES_USER: ${POSTGRES_USER:-digitaldoor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Порт наружу не открыт: база доступна только сайту внутри сети docker.
    # Для локальной отладки можно раскомментировать:
    # ports:
    #   - "127.0.0.1:5432:5432"

  web:
    build: .
    image: digital-door:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-digitaldoor}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-digitaldoor}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Задайте ADMIN_PASSWORD в .env}
      SESSION_SECRET: ${SESSION_SECRET:?Задайте SESSION_SECRET в .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      STATS_TIMEZONE: ${STATS_TIMEZONE:-Asia/Yerevan}
    ports:
      - "${WEB_PORT:-8080}:3000"
    volumes:
      - uploads:/app/uploads

  # Резервные копии базы и фото в папку ./backups (см. README, раздел «Резервные копии»).
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    # Ждём сайт: он создаёт таблицы и загружает товары при первом запуске.
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digitaldoor}
      POSTGRES_USER: ${POSTGRES_USER:-digitaldoor}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - uploads:/uploads:ro
    command: ["sh", "/scripts/backup.sh", "--loop"]

volumes:
  pgdata:
  uploads:
